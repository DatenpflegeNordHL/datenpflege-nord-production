name: One-shot proof cleanup

on:
  push:
    branches:
      - golden-proof-cleanup
    paths:
      - 'scripts/remove_template_brand_belt.py'
      - '.github/workflows/one-shot-proof-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Remove unverified template logo belt
        run: python scripts/remove_template_brand_belt.py

      - name: Verify static site after cleanup
        run: |
          python -m unittest discover -s tests
          python scripts/site_audit.py
          node --check assets/home-de.js
          node --check assets/home-en.js
          node --check assets/service.js

      - name: Commit cleanup result
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: remove unverified template logo belt"
          git push
