name: One-shot GitHub proof refresh

on:
  push:
    branches:
      - golden-proof-cleanup
    paths:
      - 'scripts/refresh_static_github_proof.py'
      - '.github/workflows/one-shot-github-proof-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Refresh verified static GitHub proof
        run: python scripts/refresh_static_github_proof.py

      - name: Verify static site
        run: |
          python -m unittest discover -s tests
          python scripts/site_audit.py
          node --check assets/home-de.js
          node --check assets/home-en.js
          node --check assets/service.js

      - name: Commit proof refresh
        run: |
          git add index.html en/index.html
          if git diff --cached --quiet; then
            echo "No proof refresh changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: refresh verified GitHub proof fallback"
          git push
