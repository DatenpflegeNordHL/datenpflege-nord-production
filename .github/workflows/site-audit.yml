name: Static site audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run deterministic site checks
        run: |
          python -m unittest discover -s tests
          python scripts/site_audit.py
          node --check assets/home-de.js
          node --check assets/home-en.js
          node --check assets/service.js

      - name: Build deterministic public release
        run: |
          python scripts/build_public_release.py --output .release-webroot
          test -s .release-webroot/RELEASE-MANIFEST.sha256

      - name: Upload tested public release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-webroot-${{ github.event.pull_request.head.sha || github.sha }}
          path: .release-webroot/
          if-no-files-found: error
          retention-days: 14
