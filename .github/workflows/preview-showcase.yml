name: Isolated showcase preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: isolated-showcase-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build non-indexable Pages artifact
        run: >-
          python3 scripts/build_preview_artifact.py
          --root .
          --output "$RUNNER_TEMP/dpn-showcase-pages-${{ github.run_id }}"
          --base-path /datenpflege-nord-production

      - name: Configure Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v5.0.0

      - name: Upload isolated artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/dpn-showcase-pages-${{ github.run_id }}

      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
