name: Generate social preview

on:
  push:
    branches:
      - fix/whatsapp-og-20260908
    paths:
      - 'scripts/generate_social_preview.py'
      - 'scripts/update_social_metadata.py'
      - '.github/workflows/generate-social-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate clean preview artwork
        run: python scripts/generate_social_preview.py

      - name: Refresh social metadata and cache-bust image URL
        run: python scripts/update_social_metadata.py

      - name: Commit generated preview and metadata
        run: |
          git add \
            og-datenpflege-nord.png \
            index.html \
            en/index.html \
            softwareentwicklung-luebeck/index.html \
            webentwicklung-luebeck/index.html \
            ki-automatisierung-luebeck/index.html \
            impressum/index.html \
            datenschutz/index.html
          if git diff --cached --quiet; then
            echo "Social preview and metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: refresh WhatsApp social preview"
          git push
