server {
    listen 127.0.0.1:8080;
    server_name www.datenpflege-nord.de;

    return 301 https://datenpflege-nord.de$request_uri;
}

server {
    listen 127.0.0.1:8080;
    server_name datenpflege-nord.de;
    absolute_redirect off;

    root /srv/datenpflege-nord/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/datenpflege-nord.access.log;
    error_log  /var/log/nginx/datenpflege-nord.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/contact {
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;

        add_header Cache-Control "no-store" always;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(?:docs|scripts|gallery|deploy|functions|\.git|\.github)(?:/|$) {
        return 404;
    }

    location = /og-datenpflege-nord.png {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
